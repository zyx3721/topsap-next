[package]
name = "topsap-next"
version = "1.6.0"
description = "TopSAP / 天融信 NGVONE SSL VPN 客户端"
authors = ["TopSAP-Next contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "topsap_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "topsap-client"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-pki-types = "1"
socket2 = "0.6"

libloading = "0.8"

keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
aes-gcm = "0.10"
machine-uid = "0.5"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

thiserror = "2"
base64 = "0.22"
rand = "0.8"
chrono = "0.4"
hex = "0.4"
log = "0.4"
encoding_rs = "0.8"
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinInet",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
tun = "0.7"
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
